<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opeyemi Turns 28</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#000000">
<style>
  :root { --bg:#000; --ink:#fff; --mute:#9a958b; --line:#262626; --line2:#3a3a3a; --gold:#c9a24b; --gold-hi:#e6c878; --danger:#e0574f;
          --display:'Anton',Impact,'Arial Narrow',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; padding:0 0 env(safe-area-inset-bottom); overflow-x:hidden; }
  main { max-width:560px; margin:0 auto; padding:0 16px 40px; counter-reset:sec; }

  /* Hero: full-bleed photo with an oversized wordmark set into its base */
  .hero { position:relative; margin:0 -16px; height:48vh; min-height:340px; overflow:hidden; border-bottom:1px solid var(--line); }
  .hero.tall { height:74vh; min-height:480px; }
  .hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 38%; filter:grayscale(1) contrast(1.05); }
  .hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 22%, transparent 45%, rgba(0,0,0,.85) 80%, #000 100%); }
  .hero-top { position:absolute; z-index:2; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:calc(env(safe-area-inset-top) + 14px) 16px 0; font:500 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink); }
  .hero-top b { color:var(--gold); font-weight:500; }
  .hero-in { position:absolute; z-index:2; left:16px; right:16px; bottom:14px; }
  .mark { font-family:var(--display); font-weight:400; text-transform:uppercase; font-size:clamp(68px, 24vw, 140px); line-height:.82; letter-spacing:-.01em; margin:0; color:var(--ink); }
  .mark2 { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.35); font:500 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink); }
  .mark2 .n { font-family:var(--display); font-size:clamp(34px, 11vw, 64px); line-height:.9; letter-spacing:0; color:var(--gold); }
  .intro .hero img { animation:settle 1.6s cubic-bezier(.2,.7,.2,1) both; }
  .intro .mark { animation:rise 1s .15s cubic-bezier(.2,.7,.2,1) both; }
  .intro .mark2 { animation:rise 1s .3s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes settle { from { transform:scale(1.08); opacity:0; } to { transform:scale(1); opacity:1; } }

  /* Ticker */
  .ticker { margin:0 -16px 8px; border-bottom:1px solid var(--line); overflow:hidden; white-space:nowrap; padding:11px 0; font:500 12px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }
  .ticker span { display:inline-block; animation:tick 24s linear infinite; }
  .ticker i { font-style:normal; color:var(--gold); margin:0 14px; }
  @keyframes tick { to { transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .ticker span, .intro .hero img, .intro .mark, .intro .mark2 { animation:none; } }

  /* Numbered section heads with a thin rule */
  h1 { font-family:var(--display); font-weight:400; text-transform:uppercase; font-size:56px; line-height:.9; margin:28px 0 8px; }
  h2 { counter-increment:sec; display:flex; align-items:center; gap:12px; margin:34px 0 0; padding-bottom:10px; border-bottom:1px solid var(--line2); font:500 11px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--ink); }
  h2::before { content:counter(sec, decimal-leading-zero); color:var(--gold); }
  .sub { color:var(--mute); margin:0 0 12px; }
  label.sub { display:block; margin:4px 0 0; font:500 11px/1.4 var(--mono); letter-spacing:.12em; text-transform:uppercase; }

  /* Panels: sharp, outlined, gold corner ticks like diagram marks */
  .card { position:relative; background:transparent; border:1px solid var(--line); border-top:0; padding:18px 16px; margin-bottom:0; }
  .card::before, .card::after { content:''; position:absolute; width:9px; height:9px; bottom:-1px; border-bottom:1px solid var(--gold); }
  .card::before { left:-1px; border-left:1px solid var(--gold); }
  .card::after { right:-1px; border-right:1px solid var(--gold); }
  .tabs + .card { border-top:1px solid var(--line); margin-top:16px; }

  input, select { width:100%; padding:15px 0; font:400 18px/1.2 Inter,system-ui,sans-serif; border:0; border-bottom:1px solid var(--line2); border-radius:0; background:transparent; color:var(--ink); outline:none; margin:4px 0 10px; }
  select { padding:15px 4px; background:#000; }
  input::placeholder { color:#5f5b54; }
  input:focus, select:focus { border-bottom-color:var(--gold); }

  button { display:flex; justify-content:space-between; align-items:center; width:100%; padding:17px 18px; font:500 13px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; text-align:left; border:1px solid var(--gold); border-radius:0; background:var(--gold); color:#000; margin:8px 0; cursor:pointer; transition:background .2s, color .2s; }
  button::after { content:'\2192'; font-family:Inter,sans-serif; font-size:16px; letter-spacing:0; margin-left:12px; }
  button:active { background:var(--gold-hi); }
  button.alt { background:transparent; color:var(--ink); border-color:var(--line2); }
  button.pink { background:transparent; color:var(--danger); border-color:var(--danger); }
  button.sm { width:auto; padding:9px 12px; font-size:11px; margin:0; }
  button.sm::after, .tabs button::after { content:none; }
  button:disabled { opacity:.35; }
  .row { display:flex; gap:12px; align-items:center; }
  .row > * { flex:1; min-width:0; }
  .pill { display:inline-block; padding:5px 9px; border:1px solid var(--gold); border-radius:0; font:500 10px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--gold); vertical-align:middle; }

  .lb { display:flex; align-items:baseline; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
  .lb:last-child { border:0; }
  .rank { width:28px; font:500 12px/1 var(--mono); color:var(--mute); }
  .nm { flex:1; font-weight:600; font-size:17px; min-width:0; overflow-wrap:anywhere; }
  .pts { font-family:var(--display); font-size:26px; line-height:1; font-variant-numeric:tabular-nums; }
  .lb:nth-child(1) .rank, .lb:nth-child(1) .pts { color:var(--gold); }
  .tick { color:var(--gold); font:500 11px/1.5 var(--mono); letter-spacing:.12em; text-transform:uppercase; }
  .big { font-family:var(--display); text-transform:uppercase; font-size:clamp(46px, 15vw, 84px); text-align:center; padding:26px 4px 14px; word-break:break-word; line-height:.92; color:var(--ink); }
  .center { text-align:center; }
  .log { font-size:14px; color:var(--mute); padding:7px 0; border-bottom:1px dashed #1c1c1c; }
  .log:last-child { border:0; }
  .err { color:var(--danger); min-height:20px; font-size:14px; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:18px 0 4px; }
  .top .sub { margin:0; font-size:20px; color:var(--ink); }
  a { color:var(--gold); text-underline-offset:4px; }
  .foot { margin-top:22px; font:500 11px/1.4 var(--mono); letter-spacing:.14em; text-transform:uppercase; }
  .tabs { display:flex; margin:16px 0 0; border:1px solid var(--line2); }
  .tabs button { justify-content:center; text-align:center; background:transparent; color:var(--mute); border:0; border-right:1px solid var(--line2); padding:14px 6px; font-size:11px; margin:0; }
  .tabs button:last-child { border-right:0; }
  .tabs button.on { background:var(--ink); color:#000; }
  .hide { display:none; }

  /* Empire: the reading list and the tappable player picker */
  .read-rule { border:1px solid var(--line2); border-left:3px solid var(--gold); padding:12px 14px; margin:0 0 14px; }
  .read-rule b { color:var(--gold); }
  .namerow { display:flex; align-items:baseline; gap:14px; padding:15px 12px; border:1px solid var(--line); margin-bottom:6px; cursor:pointer; }
  .namerow .num { width:26px; font:500 12px/1 var(--mono); color:var(--gold); }
  .namerow .nm { flex:1; font-weight:600; font-size:18px; min-width:0; overflow-wrap:anywhere; }
  .namerow.read { border-color:#141414; opacity:.4; }
  .namerow.read .nm { text-decoration:line-through; }
  .picks { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px; }
  .pick { width:auto; flex:1 1 44%; margin:0; padding:14px 12px; background:transparent; color:var(--ink); border-color:var(--line2);
          font:600 15px/1.2 Inter,system-ui,sans-serif; letter-spacing:0; text-transform:none; }
  .pick::after { content:none; }
  .pick.on { background:var(--gold); color:#000; border-color:var(--gold); }
  .pick .pts { font-family:var(--display); font-size:16px; line-height:1; opacity:.7; }
</style>
</head>
<body>
<main id="app" class="intro"></main>

<script src="config.js"></script>
<script>
// ---- Setup: paste your Firebase Realtime Database URL in config.js ----
const CONFIG = window.CONFIG || { DB_URL: '', GM_PIN: '1234' };
const DB = CONFIG.DB_URL.replace(/\/$/, '') + '/gamenight';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = (s, n) => String(s || '').replace(/\s+/g, ' ').trim().slice(0, n);
const rid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: (k) => { try { localStorage.removeItem(k); } catch (e) {} },
};

let me = { id: store.get('pid'), name: store.get('pname') };
let pin = store.get('gmpin');
let isGM = !!pin && pin === CONFIG.GM_PIN && location.search.includes('gm');
let tab = 'play';
let S = null, R = null;
let picked = null;      // player the game master has tapped
let asking = false;
let typing = false;

async function fb(path, method, body) {
  const r = await fetch(`${DB}/${path}.json`, { method: method || 'GET', body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) throw new Error('Connection problem');
  return r.json();
}
const emp = () => (R && R.empire) || { status: 'idle', prize: 10 };
const addLog = (text) => fb('log/' + rid(), 'PUT', { t: Date.now(), text });

const api = {
  async join(name) {
    name = clean(name, 24);
    if (!name) throw new Error('Name needed');
    const list = (R && R.players) || (await fb('players')) || {};
    const ex = Object.entries(list).find(([, p]) => p.name.toLowerCase() === name.toLowerCase());
    if (ex) return { id: ex[0], name: ex[1].name };
    const id = rid();
    await fb('players/' + id, 'PUT', { name, points: 0 });
    addLog(name + ' checked in');
    return { id, name };
  },
  async submit(pid, text) {
    text = clean(text, 40);
    if (!text) throw new Error('Type a name');
    // Check the live status, not the cached copy, so a late name can't slip in
    // after the game master has started reading.
    const status = await fb('empire/status');
    if (status !== 'submitting') throw new Error('Submissions are closed');
    await fb('empire/subs/' + pid, 'PUT', text);
  },
};

const gmActions = {
  async open(b) { await fb('empire', 'PUT', { status: 'submitting', prize: Math.max(0, +b.prize || 10) }); addLog('Empire is open. Submit your name!'); },
  async read() {
    // Shuffle once and store the order, so the list reads the same on any phone
    // the game master picks up.
    const subs = (await fb('empire/subs')) || {};
    const names = Object.values(subs).filter(x => typeof x === 'string');
    if (!names.length) throw new Error('No names yet');
    const a = new Uint32Array(names.length); crypto.getRandomValues(a);
    for (let i = names.length - 1; i > 0; i--) { const j = a[i] % (i + 1); [names[i], names[j]] = [names[j], names[i]]; }
    await fb('empire', 'PATCH', { status: 'reading', order: names, marks: null });
  },
  async mark(b) {
    // Cross a name off, or put it back if it was tapped by mistake.
    const was = await fb('empire/marks/' + b.i);
    await fb('empire/marks/' + b.i, 'PUT', was ? null : true);
  },
  async played() {
    const E = (await fb('empire')) || {};
    if (E.status !== 'reading') return;
    // The names have been read aloud, so drop the text and keep only who submitted.
    const marks = {}; Object.keys(E.subs || {}).forEach(k => marks[k] = true);
    await fb('empire', 'PATCH', { status: 'playing', subs: marks, order: null, marks: null });
    addLog('All names read. Empire is on!');
  },
  async winner(b) {
    const p = await fb('players/' + b.pid); if (!p) throw new Error('Pick a player');
    const pts = Math.max(0, +b.points || emp().prize || 0);
    await fb('players/' + b.pid + '/points', 'PUT', (p.points || 0) + pts);
    await fb('empire', 'PATCH', { status: 'done', winner: b.pid });
    addLog(p.name + ' won Empire (+' + pts + ')');
  },
  async reset() { await fb('empire', 'PUT', { status: 'idle', prize: 10 }); },
  async award(b) {
    const p = await fb('players/' + b.pid); if (!p) throw new Error('Pick a player');
    const pts = Math.round(+b.points || 0);
    await fb('players/' + b.pid + '/points', 'PUT', (p.points || 0) + pts);
    addLog(p.name + ' ' + (pts >= 0 ? '+' : '') + pts + (b.label ? ' (' + clean(b.label, 30) + ')' : ''));
  },
  async remove(b) { await fb('players/' + b.pid, 'DELETE'); await fb('empire/subs/' + b.pid, 'DELETE'); },
  async wipe() { picked = null; await fb('', 'PUT', null); },
};

function buildState() {
  const E = emp();
  const subs = E.subs || {};
  const players = Object.entries(R.players || {})
    .map(([id, p]) => ({ id, name: p.name, points: p.points || 0, submitted: !!subs[id] }))
    .sort((a, b) => b.points - a.points || a.name.localeCompare(b.name));
  const log = Object.values(R.log || {}).sort((a, b) => b.t - a.t).slice(0, 15);
  const win = E.winner && R.players && R.players[E.winner];
  return {
    players, log,
    empire: {
      status: E.status || 'idle',
      submitted: Object.keys(subs).length, total: players.length,
      mine: me.id && typeof subs[me.id] === 'string' ? subs[me.id] : null,
      winner: win ? win.name : null, prize: E.prize || 10,
      order: Array.isArray(E.order) ? E.order : [], marks: E.marks || {},
    },
  };
}

async function poll() {
  try {
    R = (await fb('')) || {};
    S = buildState();
    if (me.id && !(R.players && R.players[me.id])) { me = {}; store.del('pid'); store.del('pname'); }
    // Forget a tapped player who has since left.
    if (picked && !(R.players && R.players[picked])) picked = null;
    if (!typing) render();
  } catch (e) {}
}

// Shared header: full-bleed photo, oversized wordmark and a ticker.
// The intro animation plays only on the first paint, not on every 1.5s poll.
const TICK = ['Empire', 'Imposter', 'Trivia', 'Black tie', 'Gold standard'].map(w => w + '<i>&#10022;</i>').join('');
function hero(tall) {
  const n = S ? S.players.length : 0;
  return `<header class="hero${tall ? ' tall' : ''}"><img src="hero.jpg" alt="Opeyemi in a black suit and sunglasses, repeated four times">
    <div class="hero-top"><span>Game Night</span><span><b>&#9733;</b> ${n ? n + ' here' : 'Birthday'}</span></div>
    <div class="hero-in"><h1 class="mark">Opeyemi</h1><div class="mark2"><span>Turns</span><span class="n">28</span><span>Black &amp; Gold</span></div></div>
  </header>
  <div class="ticker"><span>${TICK + TICK + TICK + TICK}</span></div>`;
}
setTimeout(() => document.getElementById('app').classList.remove('intro'), 2000);

function leaderboard() {
  if (!S.players.length) return '<p class="sub">Nobody here yet.</p>';
  return S.players.map((p, i) => `
    <div class="lb"><div class="rank">${i + 1}</div><div class="nm">${esc(p.name)}${p.id === me.id ? ' <span class="pill">you</span>' : ''}</div><div class="pts">${p.points}</div></div>`).join('');
}

function render() {
  const el = $('#app');
  if (asking) return;
  if (isGM && !pin) return;
  if (!me.id && !isGM) return renderJoin(el);
  if (!S) { el.innerHTML = hero(false) + '<p class="sub" style="margin-top:20px">Loading...</p>'; return; }
  const tabs = isGM ? `<div class="tabs"><button class="${tab==='play'?'on':''}" onclick="setTab('play')">Play</button><button class="${tab==='gm'?'on':''}" onclick="setTab('gm')">Game master</button><button class="${tab==='board'?'on':''}" onclick="setTab('board')">Scores</button></div>` : '';
  let html = hero(false) + `<div class="top"><p class="sub">${me.name ? 'Hi, ' + esc(me.name) : 'Game master'}</p><span class="pill">${isGM ? 'Game master' : 'Guest'}</span></div>${tabs}`;
  if (!isGM || tab === 'play') html += renderPlay() + `<h2>Leaderboard</h2><div class="card">${leaderboard()}</div>` + renderLog();
  else if (tab === 'gm') html += renderGM();
  else html += `<div class="card">${leaderboard()}</div>` + renderLog();
  el.innerHTML = html;
}

function renderLog() {
  if (!S.log.length) return '';
  return `<h2>Activity</h2><div class="card">${S.log.map(l => `<div class="log">${esc(l.text)}</div>`).join('')}</div>`;
}

function renderJoin(el) {
  el.innerHTML = `
    ${hero(true)}
    <h2>Check in</h2>
    <div class="card">
      <p class="sub" style="margin:0">Use the name everyone knows you by.</p>
      <input id="jn" placeholder="Your name" maxlength="24" autocomplete="off" onfocus="typing=true" onblur="typing=false">
      <button onclick="join()">Check in</button>
      <div class="err" id="jerr"></div>
    </div>
    <p class="foot center"><a href="?gm" onclick="return askPin()">I'm the game master</a></p>`;
}

async function join() {
  const name = $('#jn').value;
  try {
    const r = await api.join(name);
    me = { id: r.id, name: r.name };
    store.set('pid', r.id); store.set('pname', r.name);
    typing = false; poll();
  } catch (e) { $('#jerr').textContent = e.message; }
}

function askPin() {
  asking = true;
  const el = $('#app');
  el.innerHTML = hero(false) + `<h2>Game master</h2><div class="card"><p class="sub" style="margin:0">Enter the PIN.</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button onclick="tryPin()">Unlock</button><div class="err" id="perr"></div></div>`;
  return false;
}
async function tryPin() {
  const p = $('#pin').value;
  try {
    if (p !== CONFIG.GM_PIN) throw new Error('bad'); pin = p;
    store.set('gmpin', p); asking = false; isGM = true; tab = 'gm'; poll();
  } catch (e) { pin = null; $('#perr').textContent = 'Wrong PIN'; }
}
function setTab(t) { tab = t; render(); }

function renderPlay() {
  const E = S.empire;
  let inner;
  if (E.status === 'idle') inner = `<p class="sub" style="margin:0">Waiting for the next game. Hang tight.</p>`;
  else if (E.status === 'submitting') {
    const mine = E.mine && E.mine !== true ? E.mine : '';
    inner = me.id ? `
      <p style="margin:0 0 6px"><b>Pick a name for the cup.</b> Anyone alive or fictional. Keep it secret.</p>
      ${mine ? `<p class="tick">Locked in: ${esc(mine)}. You can change it until the GM starts reading.</p>` : ''}
      <input id="en" placeholder="Your name for the cup" maxlength="40" autocomplete="off" onfocus="typing=true" onblur="typing=false">
      <button onclick="submitName()">${mine ? 'Change it' : 'Submit'}</button><div class="err" id="eerr"></div>
      <p class="sub" style="margin:0">${E.submitted} of ${E.total} in</p>` : `<p class="sub">${E.submitted} names in.</p>`;
  }
  else if (E.status === 'reading') inner = `<div class="big">Listen up</div><p class="sub center">The game master is reading the names. One time only.</p>`;
  else if (E.status === 'playing') inner = `<div class="big">Empire is live</div><p class="sub center">Play it out in real life. The game master records the winner.</p>`;
  else inner = `<div class="big">${esc(E.winner || '?')} wins</div><p class="sub center">+${E.prize} points</p>`;
  return `<h2>Now playing: Empire</h2><div class="card">${inner}</div>`;
}

async function submitName() {
  const text = $('#en').value;
  try { await api.submit(me.id, text); typing = false; $('#en').blur(); poll(); }
  catch (e) { $('#eerr').textContent = e.message; }
}

function nameOf(pid) {
  const p = S.players.find(x => x.id === pid);
  return p ? p.name : '';
}

// Tappable list instead of a dropdown. A dropdown lost its selection every time
// the page refreshed, which made picking a winner impossible.
function pickList() {
  if (!S.players.length) return '<p class="sub">No players yet.</p>';
  return '<div class="picks">' + S.players.map(p =>
    `<button class="pick ${picked === p.id ? 'on' : ''}" onclick="pick('${p.id}')">${esc(p.name)} <span class="pts">${p.points}</span></button>`
  ).join('') + '</div>';
}

function pick(pid) { picked = picked === pid ? null : pid; render(); }

function renderGM() {
  const E = S.empire;
  let h = `<h2>Empire</h2><div class="card">`;
  if (E.status === 'idle' || E.status === 'done') {
    h += `<label class="sub">Points for the winner</label><input id="prize" type="number" inputmode="numeric" value="${E.prize || 10}" onfocus="typing=true" onblur="typing=false"><button onclick="gm('open',{prize:+$('#prize').value})">Open a new round</button>`;
    if (E.status === 'done') h += `<p class="sub center">Last winner: ${esc(E.winner || '')}</p>`;
  } else if (E.status === 'submitting') {
    h += `<p><b>${E.submitted}</b> of ${E.total} players have submitted.</p>
      <div>${S.players.map(p => `<div class="lb"><div class="nm">${esc(p.name)}</div>${p.submitted ? '<span class="tick">in</span>' : '<span class="sub" style="margin:0">waiting</span>'}</div>`).join('')}</div>
      <button onclick="gm('read')" ${E.submitted ? '' : 'disabled'}>Close and start reading</button>
      <button class="alt" onclick="gm('reset')">Cancel round</button>`;
  } else if (E.status === 'reading') {
    const done = Object.keys(E.marks).length;
    h += `<p class="read-rule">Read each name out loud <b>once only</b>. Don't repeat one, even if someone asks.</p>
      <p class="sub">Tap a name to cross it off. ${done} of ${E.order.length} read.</p>
      <div>${E.order.map((n, i) => `<div class="namerow ${E.marks[i] ? 'read' : ''}" onclick="gm('mark',{i:${i}})"><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="nm">${esc(n)}</span><span class="tick">${E.marks[i] ? 'read' : ''}</span></div>`).join('')}</div>
      <button onclick="gm('played')">Done reading, start the game</button>
      <button class="alt" onclick="gm('reset')">Cancel round</button>`;
  } else if (E.status === 'playing') {
    h += `<p class="sub">Game is on. When it ends, pick the winner.</p>
      ${pickList()}
      <label class="sub">Points</label>
      <input id="wpts" type="number" inputmode="numeric" value="${E.prize}" onfocus="typing=true" onblur="typing=false">
      <button onclick="gm('winner',{pid:picked,points:+$('#wpts').value})" ${picked ? '' : 'disabled'}>${picked ? 'Record ' + esc(nameOf(picked)) + ' as winner' : 'Tap the winner above'}</button>
      <button class="alt" onclick="gm('reset')">Cancel round</button>`;
  }
  h += `</div><h2>Other games</h2><div class="card">
      <p class="sub" style="margin:0 0 6px">Award points for anything: Imposter, trivia, food eating contest.</p>
      ${pickList()}
      <div class="row"><input id="alabel" placeholder="Game or reason" onfocus="typing=true" onblur="typing=false"><input id="apts" type="number" inputmode="numeric" value="5" onfocus="typing=true" onblur="typing=false"></div>
      <button onclick="gm('award',{pid:picked,points:+$('#apts').value,label:$('#alabel').value})" ${picked ? '' : 'disabled'}>${picked ? 'Give points to ' + esc(nameOf(picked)) : 'Tap a player above'}</button>
    </div>
    <h2>Players</h2><div class="card">${S.players.map(p => `<div class="lb"><div class="nm">${esc(p.name)}</div><button class="sm alt" onclick="if(confirm('Remove ${esc(p.name)}?'))gm('remove',{pid:'${p.id}'})">Remove</button></div>`).join('') || '<p class="sub">No players yet.</p>'}</div>
    <h2>Danger zone</h2><button class="pink" onclick="if(confirm('Wipe everything?'))gm('wipe',{})">Wipe all data</button>`;
  return h;
}


async function gm(path, body) {
  try {
    await gmActions[path](body || {});
    if (path === 'winner' || path === 'award') picked = null;
    typing = false;
    await poll();
  } catch (e) { alert(e.message); }
}

if (!CONFIG.DB_URL) {
  document.getElementById('app').innerHTML = hero(true) + '<p class="sub" style="margin-top:20px">Setup needed: add your Firebase database URL to config.js (see README).</p>';
} else {
  if (!isGM && location.search.includes('gm')) askPin();
  poll(); setInterval(poll, 1500);
}
</script>
</body>
</html>
